<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P62 — NMI Pay tokenization harness (sandbox)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; max-width: 560px; }
  #payment-container { border: 1px solid #ccc; padding: 12px; min-height: 120px; }
  #events { white-space: pre-wrap; font: 11px/1.5 monospace; background: #f6f6f6; padding: 8px; max-height: 300px; overflow: auto; }
  #result { white-space: pre-wrap; font: 12px/1.5 monospace; background: #eef7ee; padding: 8px; }
</style>
</head>
<body>
<h1>P62 harness — NMI Pay component, sandbox tokenization</h1>
<p>Public tokenization key (Merchant key, "tokenization (payment component)"): embedded below.</p>
<div id="payment-container"></div>
<h3>Status</h3>
<div id="status">mounting…</div>
<h3>Result</h3>
<div id="result">(none yet)</div>
<h3>Events</h3>
<div id="events"></div>

<script src="./nmi-payments-cdn.iife.js"></script>
<script>
  // P62 proof state — everything the callbacks receive is mirrored into the DOM
  // (#events / #result) and into window.__p62 for the Playwright driver.
  window.__p62 = {
    mounted: false,
    fieldsAvailable: false,
    changes: [],
    pay: null,
    errors: []
  };

  function log(kind, data) {
    var line = new Date().toISOString() + ' [' + kind + '] ' + (typeof data === 'string' ? data : JSON.stringify(data));
    document.getElementById('events').textContent += line + '\n';
  }
  function setResult(obj) {
    document.getElementById('result').textContent = JSON.stringify(obj, null, 2);
  }
  window.addEventListener('error', function (e) { window.__p62.errors.push(String(e.message || e)); log('window-error', String(e.message || e)); });
  window.addEventListener('unhandledrejection', function (e) { window.__p62.errors.push(String(e.reason)); log('unhandledrejection', String(e.reason)); });

  window.__p62.mountCount = 0;
  function mountOpts() {
    return {
      tokenizationKey: '6VqY8T-Uc4Eh9-Nj4Vg8-Kq3WU4',
      paymentMethods: ['card'],
      surchargeProContext: { amount: '5.00', currency: 'USD' },
      onFieldsAvailable: function () {
        window.__p62.fieldsAvailable = true;
        document.getElementById('status').textContent = 'fields available';
        log('onFieldsAvailable', 'fields rendered');
      },
      onChange: function (data) {
        window.__p62.changes.push(data);
        log('onChange', data);
        if (data && data.token) {
          setResult({ source: 'onChange', token: data.token, complete: data.complete, lookupData: data.lookupData || null });
        }
      },
      onPay: function (event) {
        window.__p62.pay = event;
        log('onPay', event);
        if (event && event.token) {
          setResult({ source: 'onPay', token: event.token, lookupData: event.lookupData || null });
        }
        return Promise.resolve(true);
      }
    };
  }

  // Recovery hook for the driver: if the styling handshake raced the slow
  // first navigation, a remount (assets now cached) can win it.
  window.__p62.remount = function () {
    try { if (window.__p62.widget) window.__p62.widget.destroy(); } catch (e) { log('remount-destroy-error', String(e)); }
    document.getElementById('payment-container').innerHTML = '';
    return window.__p62.mount();
  };

  window.__p62.mount = function () {
    var widget = window.mountNmiPayments('#payment-container', mountOpts());
    window.__p62.mounted = true;
    window.__p62.widget = widget;
    window.__p62.mountCount += 1;
    document.getElementById('status').textContent = 'mounted (x' + window.__p62.mountCount + '), waiting for fields';
    log('mount', 'mountNmiPayments returned, mount #' + window.__p62.mountCount);
    return widget;
  };

  try {
    window.__p62.mount();
  } catch (err) {
    window.__p62.errors.push('mount threw: ' + (err && err.message));
    document.getElementById('status').textContent = 'mount threw: ' + (err && err.message);
    log('mount-error', String(err && err.stack || err));
  }
</script>
</body>
</html>
